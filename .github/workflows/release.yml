name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet and build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          mkdir -p dist
          go vet ./...
          go build -trimpath -ldflags="-s -w" -o "dist/diflett${ext}" .

      - name: Package archive
        shell: bash
        run: |
          archive="diflett_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          cp README.md dist/
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd dist && zip -q "../${archive}.zip" diflett.exe README.md)
          else
            tar -czf "${archive}.tar.gz" -C dist diflett README.md
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            *.tar.gz
            *.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt

      - name: Extract changelog section
        id: changelog
        run: |
          tag="${{ github.ref_name }}"
          ver="${tag#v}"
          awk -v ver="$ver" '
            /^## / {
              if (found) exit
              if (index($0, "## [" ver "]") == 1 || index($0, "## [v" ver "]") == 1 || $0 == "## " ver || $0 == "## v" ver || index($0, "## " ver " ") == 1 || index($0, "## v" ver " ") == 1) {
                found = 1
                next
              }
            }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "path=release-notes.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.changelog.outputs.path }}
          generate_release_notes: true
          files: artifacts/*
